# Tags plugin configuration
# Colors use Minecraft hex colors.

tags:
  owner:
    display: "OWNER"
    color: "#AA0000"
  co-owner:
    display: "CO-OWNER"
    color: "#FF5555"
  admin:
    display: "ADMIN"
    color: "#FFAA00"
  helper:
    display: "HELPER"
    color: "#32CD32"
  discord-mod:
    display: "DISCORD MOD"
    color: "#00008B"
  donator:
    display: "DONATOR"
    color: "#55FFFF"
  chad:
    display: "CHAD"
    color: "#808080"
  schiavo:
    display: "SLAVE"
    color: "#5A3A24"

# Automatic nametags based on total playtime.
# The highest reached tier is used automatically in chat.
# time is expressed in hours.
playtime:
  enabled: true
  tiers:
    - hours: 0
      tag: "new"
    - hours: 10
      tag: "member"
    - hours: 25
      tag: "veteran"
    - hours: 50
      tag: "elite"
    - hours: 100
      tag: "legend"

chat:
  separator: " » "
  tag-brackets: true
