# Tags plugin configuration
# Colors use Minecraft hex colors.

tags:
  owner:
    display: "OWNER"
    color: "#AA0000"
  co-owner:
    display: "CO-OWNER"
    color: "#FF5555"
  admin:
    display: "ADMIN"
    color: "#FFAA00"
  helper:
    display: "HELPER"
    color: "#55FF55"
  donator:
    display: "DONATOR"
    color: "#55FFFF"
  chad:
    display: "CHAD"
    color: "#808080"
  schiavo:
    display: "SLAVE"
    color: "#5A3A24"

chat:
  separator: " » "
  tag-brackets: true
