name: Tags
version: '1.0.0'
main: it.gekojr.tags.TagsPlugin
api-version: '26.3'
author: Gekojr
description: Simple chat nametags with Tebex-friendly commands.

commands:
  nametag:
    description: Manage player chat tags.
    usage: /nametag <set|remove|get|list|reload>
    aliases: [tag]
    permission: tags.admin

permissions:
  tags.admin:
    description: Allows managing chat nametags.
    default: op
