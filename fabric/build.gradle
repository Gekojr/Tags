plugins { id 'net.fabricmc.fabric-loom' version '1.17.12' }
version = '1.0.0-fabric'
group = 'it.gekojr'
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:26.2'
 implementation 'net.fabricmc:fabric-loader:0.19.5'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
 implementation 'org.yaml:snakeyaml:2.4'
 include 'org.yaml:snakeyaml:2.4'
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }

dependencies {
 testImplementation platform('org.junit:junit-bom:5.12.2')
 testImplementation 'org.junit.jupiter:junit-jupiter'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
