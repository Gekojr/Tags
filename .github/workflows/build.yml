name: Build Tags

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Create checksum
        run: sha256sum target/Tags.jar > target/Tags.jar.sha256

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: Tags-plugin
          path: |
            target/Tags.jar
            target/Tags.jar.sha256
          if-no-files-found: error
